name: Kaggle cleanup (delete kernel to purge injected secrets)

# kaggle-trigger.yml bakes secret values into the pushed notebook, so they sit in
# the (private) Kaggle kernel until purged. This workflow deletes the kernel a few
# hours after the daily run -- once it has finished on its own -- so the secrets
# don't persist. The next daily push recreates the kernel (confirmed push
# recreates a deleted kernel). If a run is still in progress, it skips so it can't
# kill the run.
on:
  schedule:
    - cron: "30 5 * * *"     # ~11:00 IST -- well after the ~07:00 IST generation finishes
  workflow_dispatch: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet kaggle
      - name: Delete kernel if the run has finished
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then echo "::error::Missing KAGGLE_API_TOKEN"; exit 1; fi
          K=allinone2015/acestep-daily
          s=$(kaggle kernels status "$K" 2>&1); echo "$s"
          if echo "$s" | grep -qiE "running|queued"; then
            echo "Run still in progress -- skipping delete (it'll be purged on the next cleanup)."
            exit 0
          fi
          kaggle kernels delete "$K" -y || echo "(nothing to delete)"
