name: Kaggle cleanup (delete kernel to purge injected secrets)

# kaggle-trigger.yml bakes secret values into the pushed notebook, so they sit
# in the (private) Kaggle kernel until purged. This workflow deletes the kernel
# a few hours after the daily run -- once it has finished on its own -- so the
# secrets don't persist. The next daily push recreates a deleted kernel
# (confirmed). If a run is still in progress, the kernel is skipped so the run
# can't be killed.
on:
  workflow_dispatch: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet kaggle
      - name: Delete kernels whose runs have finished
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then echo "::error::Missing KAGGLE_API_TOKEN"; exit 1; fi
          for K in allinone2015/acestep-daily; do
            s=$(kaggle kernels status "$K" 2>&1); echo "$K: $s"
            if echo "$s" | grep -qiE "running|queued"; then
              echo "$K still in progress -- skipping delete (it'll be purged on the next cleanup)."
              continue
            fi
            kaggle kernels delete "$K" -y || echo "($K: nothing to delete)"
          done
