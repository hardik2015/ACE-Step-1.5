name: Kaggle recreate test (throwaway)

# One-off probe: does `kaggle kernels push` recreate a kernel after it's deleted?
# Deletes allinone2015/acestep-daily, then pushes, and reports the verdict.
on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet kaggle
      - name: delete then push-recreate
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set +e
          K=allinone2015/acestep-daily
          echo "=== status BEFORE delete ==="
          kaggle kernels status "$K"
          echo "=== DELETE ==="
          kaggle kernels delete "$K" -y
          sleep 12
          echo "=== status AFTER delete (expect not found) ==="
          kaggle kernels status "$K"
          echo "=== PUSH (does it recreate?) ==="
          out=$(kaggle kernels push -p kaggle/ --accelerator NvidiaTeslaT4 2>&1); echo "$out"
          sleep 12
          echo "=== status AFTER push ==="
          kaggle kernels status "$K"
          echo "=== VERDICT ==="
          if echo "$out" | grep -qi "successfully pushed"; then
            echo "RECREATE_OK"
          elif echo "$out" | grep -qi "notebook not found"; then
            echo "RECREATE_FAIL"
          else
            echo "RECREATE_UNCLEAR"
          fi
