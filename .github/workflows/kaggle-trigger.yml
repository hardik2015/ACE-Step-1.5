name: Kaggle deploy (manual only)

# IMPORTANT: this is NOT the daily trigger. `kaggle kernels push` UNLINKS the
# kernel's attached Secrets every time (known Kaggle API behavior), so a pushed
# run can't read GITHUB_TOKEN / GDRIVE_* -> clone + upload fail. The daily run is
# Kaggle's built-in SCHEDULER, which re-runs the UI-configured version (T4x2 +
# internet + attached secrets). Use this ONLY to re-deploy notebook CODE changes,
# and AFTER running it re-open Add-ons -> Secrets in the UI and press Done to
# re-attach the secrets.
on:
  workflow_dispatch: {}

# Avoid overlapping kernel runs if several commits land close together.
concurrency:
  group: kaggle-trigger
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: pip install --quiet kaggle

      # The notebook is committed (see .gitignore), so no rebuild is needed. We
      # append a run-stamp comment to the notebook so each push is unique content
      # and Kaggle creates a fresh, re-runnable version. We do NOT touch the title
      # -- it must keep resolving to the kernel slug 'acestep-daily'.
      - name: Stamp run time into the notebook (forces a fresh version)
        run: |
          python - <<'PY'
          import json, datetime, re
          p = "kaggle/acestep_kaggle_2xT4_weekly.ipynb"
          nb = json.load(open(p, encoding="utf-8"))
          src = nb["cells"][0]["source"]
          if isinstance(src, list):
              src = "".join(src)
          stamp = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          src = re.sub(r"\n# run-stamp:.*\n?$", "\n", src).rstrip("\n") + f"\n# run-stamp: {stamp}\n"
          nb["cells"][0]["source"] = src
          json.dump(nb, open(p, "w", encoding="utf-8"), indent=1, ensure_ascii=False)
          print("notebook run-stamp ->", stamp)
          PY

      - name: Push & run kernel
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "::error::Missing repo secret KAGGLE_API_TOKEN (Kaggle -> Settings -> API Tokens)"; exit 1
          fi
          out=$(kaggle kernels push -p kaggle/ --accelerator NvidiaTeslaT4 2>&1) || true
          echo "$out"
          if echo "$out" | grep -qiE "kernel push error|notebook not found|unauthorized|forbidden|invalid"; then
            echo "::error::kaggle kernels push failed (see output above)"; exit 1
          fi

      - name: Where to watch it
        run: echo "Run started. Watch it at https://www.kaggle.com/code (your 'ACE-Step Daily' kernel)."
