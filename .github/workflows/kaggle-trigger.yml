name: Kaggle daily run (inject secrets, run on T4x2, purge)

# Event-driven on the routine's songs.json commit (fire-and-forget):
#   1. regenerate the notebook (placeholders)
#   2. replace each __NAME__ placeholder with the real value from a GitHub repo
#      secret (safely repr-encoded; never echoed)
#   3. kaggle kernels push --accelerator NvidiaTeslaT4  (creates + runs on T4x2)
# Then this workflow EXITS -- the Kaggle run finishes on its own (~20-40 min).
# A separate workflow (kaggle-cleanup.yml) deletes the kernel later to purge the
# injected secrets; the next push recreates it (confirmed push recreates).
#
# Secrets live ONLY in GitHub repo secrets (+ transiently on this runner / in the
# kernel until the cleanup runs). Required repo secrets:
#   KAGGLE_API_TOKEN, MAIN_GITHUB_TOKEN (the clone PAT -- GITHUB_TOKEN is reserved),
#   GDRIVE_FOLDER_ID, and GDRIVE_OAUTH_TOKEN  *or*  the trio
#   GDRIVE_REFRESH_TOKEN + GDRIVE_CLIENT_ID + GDRIVE_CLIENT_SECRET.
on:
  push:
    branches: [main]
    paths: ["kaggle/songs.json"]
  workflow_dispatch: {}

concurrency:
  group: kaggle-daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet kaggle

      - name: Regenerate notebook (placeholders)
        run: python kaggle/build_notebook.py

      - name: Replace placeholders with real secrets (no echo)
        env:
          MAIN_GITHUB_TOKEN: ${{ secrets.MAIN_GITHUB_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_TOKEN: ${{ secrets.GDRIVE_OAUTH_TOKEN }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import json, os
          p = "kaggle/acestep_kaggle_2xT4_weekly.ipynb"
          nb = json.load(open(p, encoding="utf-8"))
          src = nb["cells"][0]["source"]
          if isinstance(src, list):
              src = "".join(src)
          mapping = {
              "__GITHUB_TOKEN__":         os.environ.get("MAIN_GITHUB_TOKEN", ""),
              "__GDRIVE_FOLDER_ID__":     os.environ.get("GDRIVE_FOLDER_ID", ""),
              "__GDRIVE_OAUTH_TOKEN__":   os.environ.get("GDRIVE_OAUTH_TOKEN", ""),
              "__GDRIVE_REFRESH_TOKEN__": os.environ.get("GDRIVE_REFRESH_TOKEN", ""),
              "__GDRIVE_CLIENT_ID__":     os.environ.get("GDRIVE_CLIENT_ID", ""),
              "__GDRIVE_CLIENT_SECRET__": os.environ.get("GDRIVE_CLIENT_SECRET", ""),
          }
          n = 0
          for ph, val in mapping.items():
              tok = '"%s"' % ph                       # the placeholder as written: "__NAME__"
              if val and tok in src:
                  src = src.replace(tok, repr(val))   # repr -> safe Python string literal
                  n += 1
          nb["cells"][0]["source"] = src
          json.dump(nb, open(p, "w", encoding="utf-8"), indent=1, ensure_ascii=False)
          print("replaced %d placeholder(s)" % n)
          if not os.environ.get("MAIN_GITHUB_TOKEN"):
              print("::warning::MAIN_GITHUB_TOKEN is empty -- the private-repo clone will fail")
          PY

      - name: Push & run on T4x2
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then echo "::error::Missing KAGGLE_API_TOKEN"; exit 1; fi
          out=$(kaggle kernels push -p kaggle/ --accelerator NvidiaTeslaT4 2>&1) || true
          echo "$out"
          echo "$out" | grep -qi "successfully pushed" || { echo "::error::kaggle push failed"; exit 1; }
          echo "Pushed & running. The Kaggle run finishes on its own; kaggle-cleanup.yml purges it later."
