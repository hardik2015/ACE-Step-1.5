# TEMPLATE -- this is NOT an active workflow here. It is stored outside
# .github/workflows/ on purpose so it does not run in this repo.
#
# Copy this file into the SONG repo (herry20152016/song-repo) at
#   .github/workflows/forward-to-main.yml
# and add the secret MAIN_REPO_PAT (a PAT with "Contents: read & write" on the
# MAIN repo) there.
# ---------------------------------------------------------------------------
name: Forward song specs to main repo

# Lives in the SONG repo. When the daily routine commits a new song spec here,
# this copies it into the MAIN repo via the GitHub Contents API. The
# PAT-authored commit fires the MAIN repo's matching trigger, and the Kaggle
# kernel reads the fresh song:
#   kaggle/songs.json  -> fires kaggle-trigger.yml   (stream #1: song only)
#   kaggle/songs2.json -> fires kaggle-trigger-2.yml (stream #2: song + music video)
# Files identical to the main repo's copy are skipped, so re-runs and unrelated
# pushes never fire a spurious Kaggle render.
#
# Required secret in the SONG repo:
#   MAIN_REPO_PAT - a PAT with "Contents: read & write" on the MAIN repo only.

on:
  push:
    paths:
      - "kaggle/songs.json"
      - "kaggle/songs2.json"
  workflow_dispatch: {}

concurrency:
  group: forward-to-main
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this (song) repo
        uses: actions/checkout@v4

      - name: Copy changed song specs into the main repo (fires its Kaggle triggers)
        env:
          PAT: ${{ secrets.MAIN_REPO_PAT }}
          MAIN_REPO: hardik2015/ace-step-1.5-private    # <-- change to your main repo
          MAIN_BRANCH: main
        run: |
          python3 - <<'PY'
          import base64, json, os, sys, urllib.error, urllib.request

          PAT    = os.environ["PAT"]
          REPO   = os.environ["MAIN_REPO"]
          BRANCH = os.environ["MAIN_BRANCH"]
          HDRS = {
              "Authorization": f"Bearer {PAT}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          def req(url, data=None, method="GET"):
              r = urllib.request.Request(url, data=data, headers=HDRS, method=method)
              try:
                  with urllib.request.urlopen(r, timeout=60) as resp:
                      return resp.status, json.loads(resp.read().decode() or "{}")
              except urllib.error.HTTPError as e:
                  try:
                      return e.code, json.loads(e.read().decode() or "{}")
                  except Exception:
                      return e.code, {}

          failed = False
          for path in ("kaggle/songs.json", "kaggle/songs2.json"):
              if not os.path.exists(path):
                  print(f"-- {path}: not in this repo, skipping")
                  continue
              local = open(path, "rb").read()
              api = f"https://api.github.com/repos/{REPO}/contents/{path}"

              # Current main-repo copy: sha for the update, content for the
              # changed-check (skip identical files -> no spurious render).
              code, remote = req(f"{api}?ref={BRANCH}")
              sha = remote.get("sha", "") if code == 200 else ""
              if code == 200 and remote.get("content"):
                  try:
                      if base64.b64decode(remote["content"]) == local:
                          print(f"-- {path}: main repo already up to date, skipping")
                          continue
                  except Exception:
                      pass

              body = {"message": f"sync {os.path.basename(path)} from song repo",
                      "content": base64.b64encode(local).decode(),
                      "branch": BRANCH}
              if sha:
                  body["sha"] = sha
              code, resp = req(api, json.dumps(body).encode(), "PUT")
              commit = (resp.get("commit") or {}).get("sha", "")
              print(f"-- {path}: HTTP {code} {commit}")
              if code not in (200, 201):
                  print(json.dumps(resp)[:500])
                  failed = True
          sys.exit(1 if failed else 0)
          PY
